<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TodoMVC — Modern ESM Rewrite</title>
  <style>
    :root { --bg: #0f172a; --card: #111827; --border: #1f2937; --text: #f8fafc; --muted: #94a3b8; --accent: #22d3ee; }
    * { box-sizing: border-box; }
    body { font: 14px/1.5 Inter, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 16px; }
    h1 { text-align: center; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); margin: 0 0 18px; }
    .todoapp { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
    .header { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--border); }
    .new-todo { flex: 1; background: #0b1120; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 16px; outline: none; }
    .add-btn { padding: 10px 18px; background: var(--accent); color: #082f49; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .toggle-all-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .todo-list { list-style: none; margin: 0; padding: 0; }
    .todo-list li { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 16px; }
    .todo-list li.completed label { text-decoration: line-through; color: var(--muted); }
    .todo-item-left { display: flex; align-items: center; gap: 10px; }
    .destroy { background: transparent; border: 0; color: #f43f5e; font-size: 18px; cursor: pointer; }
    .footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 13px; color: var(--muted); }
    .filters { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
    .filters button { background: transparent; border: 1px solid transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
    .filters button.selected { border-color: var(--accent); color: var(--accent); }
    .clear-completed { background: transparent; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>todos (modern)</h1>
  <section class="todoapp">
    <header class="header">
      <input id="new-todo" class="new-todo" placeholder="What needs to be done?" autofocus />
      <button id="add-todo-btn" class="add-btn" type="button">Add</button>
    </header>
    <section id="main" class="main hidden">
      <div class="toggle-all-row">
        <input id="toggle-all" type="checkbox" />
        <label for="toggle-all">Mark all as complete</label>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </section>
    <footer id="footer" class="footer hidden">
      <span id="todo-count" class="todo-count">0 items left</span>
      <ul class="filters">
        <li><button type="button" data-filter="all" class="selected">All</button></li>
        <li><button type="button" data-filter="active">Active</button></li>
        <li><button type="button" data-filter="completed">Completed</button></li>
      </ul>
      <button id="clear-completed" class="clear-completed hidden" type="button">Clear completed</button>
    </footer>
  </section>

  <script type="module">
    import { createTodoStore } from "/store.mjs";

    const store = createTodoStore();
    let filter = "all";

    const inputEl = document.getElementById("new-todo");
    const addBtn = document.getElementById("add-todo-btn");
    const mainEl = document.getElementById("main");
    const footerEl = document.getElementById("footer");
    const listEl = document.getElementById("todo-list");
    const countEl = document.getElementById("todo-count");
    const toggleAllEl = document.getElementById("toggle-all");
    const clearBtn = document.getElementById("clear-completed");
    const filterBtns = document.querySelectorAll(".filters button");

    function render() {
      const all = store.getAll();
      const activeCount = store.getActiveCount();
      const completedCount = store.getCompletedCount();

      mainEl.classList.toggle("hidden", all.length === 0);
      footerEl.classList.toggle("hidden", all.length === 0);
      clearBtn.classList.toggle("hidden", completedCount === 0);
      toggleAllEl.checked = all.length > 0 && activeCount === 0;
      countEl.textContent = store.formatItemsLeft();

      listEl.innerHTML = "";
      for (const t of store.getVisible(filter)) {
        const li = document.createElement("li");
        if (t.completed) li.className = "completed";

        const left = document.createElement("div");
        left.className = "todo-item-left";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "toggle";
        cb.checked = t.completed;
        cb.setAttribute("aria-label", `Toggle ${t.title}`);
        cb.addEventListener("change", () => {
          store.toggleTodo(t.id);
          render();
        });

        const label = document.createElement("label");
        label.textContent = t.title;

        const del = document.createElement("button");
        del.type = "button";
        del.className = "destroy";
        del.textContent = "×";
        del.setAttribute("aria-label", `Delete ${t.title}`);
        del.addEventListener("click", () => {
          store.deleteTodo(t.id);
          render();
        });

        left.append(cb, label);
        li.append(left, del);
        listEl.append(li);
      }
    }

    function submit() {
      if (store.addTodo(inputEl.value)) {
        inputEl.value = "";
        render();
      }
    }

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
    addBtn.addEventListener("click", submit);
    toggleAllEl.addEventListener("change", () => {
      store.toggleAll(toggleAllEl.checked);
      render();
    });
    clearBtn.addEventListener("click", () => {
      store.clearCompleted();
      render();
    });
    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        filterBtns.forEach((b) => b.classList.toggle("selected", b === btn));
        render();
      });
    });

    render();
  </script>
</body>
</html>
