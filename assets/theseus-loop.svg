<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theseus-loop-title theseus-loop-desc" id="theseus-loop-root">
        <title id="theseus-loop-title">Theseus closed-loop behavioral equivalence</title>
        <desc id="theseus-loop-desc">Six stages cycle clockwise from Baseline through Verify, Diff, Patch, Re-verify, and Regress &amp; Sign. Every stage writes artifacts into the central Evidence Ledger hub, with Patch highlighted as the autonomous coding agent gate.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #theseus-loop-root { --paper: #0b0f19; --ink: #f1f5f9; --muted: #cbd5e1; --soft: #94a3b8;
      --accent: #10b981; --accent-tint: rgba(16,185,129,0.12); --link: #22d3ee;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #theseus-loop-root { color: var(--ink); font-family: var(--sans); }
      #theseus-loop-root .diagram-scroll { overflow-x: auto; }
      #theseus-loop-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #theseus-loop-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #theseus-loop-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #theseus-loop-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #theseus-loop-root .hub { fill: var(--ink); }
      #theseus-loop-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #theseus-loop-root .focal-name { fill: var(--accent); }
      #theseus-loop-root .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
      #theseus-loop-root .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
      #theseus-loop-root .hub-sub { fill: var(--paper); opacity: 0.78; font: 400 8px var(--mono); text-anchor: middle; }
      #theseus-loop-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }</style>
          <pattern id="theseus-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#f1f5f9" fill-opacity="0.10"/></pattern>
          <marker id="theseus-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/></marker>
          <marker id="theseus-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
          <marker id="theseus-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/></marker>
          <marker id="theseus-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
        </defs>
        <rect width="1040" height="680" fill="#0b0f19"/>
        <rect width="1040" height="680" fill="url(#theseus-loop-dots)" opacity="0.55"/>

        <!-- Solid clockwise ring: six circular arcs on the r=240 station circle. -->
        <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#theseus-loop-arrow)"/>
        <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#theseus-loop-arrow)"/>
        <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#theseus-loop-arrow)"/>
        <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#theseus-loop-arrow)"/>
        <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#theseus-loop-arrow)"/>
        <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#theseus-loop-arrow)"/>

        <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
        <path class="spoke" d="M520 132 V280" marker-end="url(#theseus-loop-arrow-soft)"/>
        <path class="spoke" d="M672 252 L616 284" marker-end="url(#theseus-loop-arrow-soft)"/>
        <path class="spoke" d="M672 428 L616 396" marker-end="url(#theseus-loop-arrow-soft)"/>
        <path class="spoke" d="M520 548 V400" marker-end="url(#theseus-loop-arrow-soft)"/>
        <path class="spoke" d="M368 428 L424 396" marker-end="url(#theseus-loop-arrow-soft)"/>
        <path class="spoke" d="M368 252 L424 284" marker-end="url(#theseus-loop-arrow-soft)"/>

        <!-- Curated spoke labels beside the vertical spokes with an 8px visible gap. -->
        <rect x="532" y="200" width="48" height="16" rx="4" fill="#0b0f19"/>
        <text x="556" y="212" class="arrow-label">GOLDEN</text>
        <rect x="456" y="464" width="56" height="16" rx="4" fill="#0b0f19"/>
        <text x="484" y="476" class="arrow-label">GIT DIFF</text>

        <!-- Six stations around C=(520,340) on the 4px grid. -->
        <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
        <text x="520" y="96" class="node-name">Baseline</text>
        <text x="520" y="116" class="sublabel">kane-cli on legacy</text>

        <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
        <text x="728" y="216" class="node-name">Verify</text>
        <text x="728" y="236" class="sublabel">same flows on modern</text>

        <rect class="station" x="648" y="428" width="160" height="64" rx="6"/>
        <text x="728" y="456" class="node-name">Diff</text>
        <text x="728" y="476" class="sublabel">values + logs + bugs</text>

        <rect class="station focal" x="440" y="548" width="160" height="64" rx="6"/>
        <text x="520" y="576" class="node-name focal-name">Patch</text>
        <text x="520" y="596" class="sublabel">claude -p / --agent-cmd</text>

        <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
        <text x="312" y="456" class="node-name">Re-verify</text>
        <text x="312" y="476" class="sublabel">failing flows rerun</text>

        <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
        <text x="312" y="216" class="node-name">Regress &amp; Sign</text>
        <text x="312" y="236" class="sublabel">full pass + SHA-256</text>

        <!-- Central shared-state hub. -->
        <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
        <text x="520" y="336" class="hub-name">Evidence Ledger</text>
        <text x="520" y="360" class="hub-sub">.theseus/ + L1 packs</text>
      </svg>
